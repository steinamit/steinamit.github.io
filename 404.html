<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Amit Stein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800&family=Heebo:wght@400;500&display=swap">
<style>
:root{--bg:#F6F7F9;--paper:#FFFFFF;--ink:#0F1726;--muted:#5B6474;--rule:#DCE0E7;--accent:#2747D9}
@media (prefers-color-scheme:dark){:root{--bg:#0D121B;--paper:#151C28;--ink:#E7EBF2;--muted:#9AA4B5;--rule:#283244;--accent:#7F96FF;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.6 "Heebo","Segoe UI",Arial,sans-serif;padding:24px 16px}
main{max-width:520px;width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:32px 28px}
.code{font:800 56px/1 "Rubik","Segoe UI",Arial,sans-serif;color:var(--accent);margin:0 0 12px}
h1{font:700 24px/1.25 "Rubik","Segoe UI",Arial,sans-serif;margin:0 0 8px}
p{margin:0 0 6px;color:var(--muted)}
.he{direction:rtl;text-align:right;margin-top:18px;padding-top:18px;border-top:1px solid var(--rule)}
a.home{display:inline-block;margin-top:22px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500;border-radius:10px;padding:10px 16px}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>This page doesn't exist.</h1>
  <p>The link may be old, or the address may have a typo.</p>
  <div class="he" lang="he">
    <h1>העמוד הזה לא קיים.</h1>
    <p>ייתכן שהקישור ישן, או שיש טעות בכתובת.</p>
  </div>
  <a class="home" href="/">Back to the site · חזרה לאתר</a>
</main>
</body>
</html>
